<script type="text/javascript">

/* ── Sidebar: categories (tags) from all articles ── */
(function () {
  var list = document.getElementById('categories-list');
  if (!list || !ARTICLES) { return; }
  var counts = {};
  var order  = [];
  for (var i = 0; i < ARTICLES.length; i++) {
    var tags = ARTICLES[i].tags;
    for (var j = 0; j < tags.length; j++) {
      var tag = tags[j];
      if (!counts[tag]) { counts[tag] = 0; order.push(tag); }
      counts[tag]++;
    }
  }
  order.sort();
  var html = '';
  for (var k = 0; k < order.length; k++) {
    var t = order[k];
    html += '<a class="sidebar-link" href="#">' + t + ' (' + counts[t] + ')</a>';
  }
  list.innerHTML = html || '<span style="color:#999;font-size:11px;">No categories yet.</span>';
}());

/* ── Sidebar: 5 most recent post titles ── */
(function () {
  var list = document.getElementById('recent-posts-list');
  if (!list || !ARTICLES) { return; }
  var html = '';
  var max = Math.min(5, ARTICLES.length);
  for (var i = 0; i < max; i++) {
    var href = ARTICLES[i].body ? 'article.html?article=' + ARTICLES[i].slug : '#';
    html += '<a class="sidebar-link" href="' + href + '">' + ARTICLES[i].title + '</a>';
  }
  list.innerHTML = html;
}());

/* ── Load the requested article ── */
(function () {
  var body    = document.getElementById('article-body');
  var secTitle = document.getElementById('article-section-title');
  if (!body || !ARTICLES) { return; }

  var slug = getQueryParam('article');

  /* Find the article */
  var found = null;
  for (var i = 0; i < ARTICLES.length; i++) {
    if (ARTICLES[i].slug === slug) { found = ARTICLES[i]; break; }
  }

  /* Article not found */
  if (!found) {
    body.innerHTML =
      '<p style="color:#666;">Article not found. <a href="articles.html">&larr; Back to articles</a></p>';
    return;
  }

  /* Article found but body is empty (stub/draft) */
  if (!found.body) {
    body.innerHTML =
      '<div class="article-date" style="margin-bottom:8px;">' + found.date + '</div>' +
      '<h2>' + found.title + '</h2>' +
      '<div class="article-tags" style="margin-bottom:14px;">' + articleTagsHtml(found.tags) + '</div>' +
      '<p style="color:#666;font-style:italic;">This article hasn\'t been written yet.</p>' +
      '<p style="margin-top:20px;padding-top:12px;border-top:1px solid #ccc;font-size:11px;color:#666;">' +
        '<a href="articles.html">&larr; Back to articles</a></p>';
    document.title = found.title + ' — Harry\'s Site';
    return;
  }

  /* Render the full article */
  secTitle.innerHTML = found.title;
  document.title     = found.title + ' — Harry\'s Site';

  /* Update meta description */
  var metas = document.getElementsByTagName('meta');
  for (var m = 0; m < metas.length; m++) {
    if (metas[m].getAttribute('name') === 'description') {
      metas[m].setAttribute('content', found.excerpt);
      break;
    }
  }

  body.innerHTML =
    '<div class="article-date" style="margin-bottom:8px;">' + found.date + '</div>' +
    '<h2>' + found.title + '</h2>' +
    '<div class="article-tags" style="margin-bottom:14px;">' + articleTagsHtml(found.tags) + '</div>' +
    found.body +
    '<p style="margin-top:20px;padding-top:12px;border-top:1px solid #ccc;font-size:11px;color:#666;">' +
      '<a href="articles.html">&larr; Back to articles</a></p>';
}());

</script>
